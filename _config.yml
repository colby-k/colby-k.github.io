title: "Colby Kellersberger | Internal Audit Leader"
logo: ""

description: "Internal Audit Manager and former audit function leader with 15+ years of experience strengthening assurance, developing teams, and improving audit execution through analytics and practical technology."

meta_description: "Colby Kellersberger, CIA, CFE — Internal Audit Manager and former audit function leader with 15+ years of experience across internal audit, Big Four public accounting, compliance, accounting, and risk analytics."

image: /assets/img/portfolio-preview.png

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/portfolio-preview.png

twitter:
  card: summary_large_image

social:
  name: "Colby Kellersberger"
  links:
    - "https://www.linkedin.com/in/colby-k/"
    - "https://github.com/colby-k"

remote_theme: pages-themes/slate@v0.2.0

lang: "en"
author: "Colby Kellersberger"

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-feed

markdown: kramdown

# Compress the generated stylesheet in production.
sass:
  style: compressed

url: "https://colby-k.github.io"
baseurl: ""

google_analytics: G-QQ7MYYPFFW

# Explicitly include professional positioning and portfolio project directories.
include:
  - leadership
  - audit-impact
  - modern-audit-practice
  - audit-intelligence
  - access-conflict-explorer
  - vendor-relationship-intelligence
  - control-evidence-lab

exclude:
  # Archived product and demonstration builds remain in Git history but are not published.
  - auditticks-pro
  - auditpdf
  - promptshelf
  - auditpdf-mobile
  - auditpdf-windows
  - promptshelf-mobile
  - promptshelf-mobile-reset
  # Product-specific marketing and UI assets are retained in source control.
  - assets/img/auditpdf
  - assets/img/promptshelf
  - assets/img/AuditTicksPro_Icon.png
  - assets/css/auditticks-case-study.css
  - assets/css/auditticks-guide.css
  - assets/css/auditticks-pro.css
  - assets/css/auditticks-product-v2.css
  - assets/img/AuditTicksPro_Ribbon.png
  - assets/img/AuditTicksPro_Ribbon.webp
  - assets/img/AuditTicksPro_Tms.png
  - assets/img/AuditTicksPro_Tms.webp
  - assets/img/auditticks-evidence-annotations.webp
  - assets/img/auditticks-floating-invoice.png
  - assets/img/auditticks-keyboard-shortcuts-guide.webp
  - assets/img/auditticks-keyboard-shortcuts-settings.webp
  - assets/img/auditticks-link-to-sheet.webp
  - assets/img/auditticks-overview.webp
  - assets/img/auditticks-review-ready.webp
  - assets/img/auditticks-testing-matrix.webp
  - assets/js/auditticks-guide.js
  - assets/js/auditticks-pro.js
  - _old
  - Gemfile
  - Gemfile.lock
  - node_modules
