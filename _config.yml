title: "Colby Kellersberger | Internal Audit Leader"
logo: ""

description: "Internal Audit Manager and former audit function leader with 15+ years of experience strengthening assurance, developing teams, and improving audit execution through analytics and practical technology."

meta_description: "Colby Kellersberger, CIA, CFE — Internal Audit Manager and former audit function leader with 15+ years of experience across internal audit, Big Four public accounting, compliance, accounting, and risk analytics."

image: /assets/img/portfolio-preview.png

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/portfolio-preview.png

twitter:
  card: summary_large_image

social:
  name: "Colby Kellersberger"
  links:
    - "https://www.linkedin.com/in/colby-k/"
    - "https://github.com/colby-k"

remote_theme: pages-themes/slate@v0.2.0

lang: "en"
author: "Colby Kellersberger"

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-feed

markdown: kramdown

# Compress the generated stylesheet in production.
sass:
  style: compressed

url: "https://colby-k.github.io"
baseurl: ""

google_analytics: G-QQ7MYYPFFW

# Explicitly include portfolio application and positioning directories.
include:
  - leadership
  - audit-impact
  - auditticks-pro
  - access-conflict-explorer
  - audit-intelligence
  - vendor-relationship-intelligence
  - control-evidence-lab

exclude:
  - _old
  - Gemfile
  - Gemfile.lock
  - node_modules
