title: "Colby Kellersberger | Internal Audit Leadership, Analytics & AI"
logo: ""

description: "Internal Audit Manager combining audit leadership, full-population testing, visualization, practical technology, and responsible AI to strengthen assurance."

meta_description: "Colby Kellersberger, CIA, CFE, CICA — Internal Audit Manager with 10+ years of experience leading assurance work and using analytics, practical technology, and responsible AI to strengthen Internal Audit."

image: /assets/img/portfolio-preview.png

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/portfolio-preview.png

twitter:
  card: summary_large_image

social:
  name: "Colby Kellersberger"
  links:
    - "https://www.linkedin.com/in/colby-k/"
    - "https://github.com/colby-k"

remote_theme: pages-themes/slate@v0.2.0

lang: "en"
author: "Colby Kellersberger"

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-feed

markdown: kramdown

# Compress the generated stylesheet in production.
sass:
  style: compressed

url: "https://colby-k.github.io"
baseurl: ""

google_analytics: G-QQ7MYYPFFW

# Explicitly include portfolio application and positioning directories.
include:
  - leadership
  - audit-impact
  - auditticks-pro
  - access-conflict-explorer
  - audit-intelligence
  - vendor-relationship-intelligence
  - control-evidence-lab

exclude:
  - _old
  - Gemfile
  - Gemfile.lock
  - node_modules
