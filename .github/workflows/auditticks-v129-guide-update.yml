name: One-time AuditTicks v1.2.29 guide update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auditticks-v129-guide-update.yml'

permissions:
  contents: write

jobs:
  update-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update guide
        run: python .github/scripts/update_auditticks_v129_guide.py
      - name: Commit guide update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auditticks-pro/guide/index.md
          git commit -m "Update AuditTicks guide for v1.2.29 position controls"
          git push
