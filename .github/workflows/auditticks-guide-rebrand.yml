name: One-time AuditTicks guide rebrand

on:
  push:
    paths:
      - '.github/workflows/auditticks-guide-rebrand.yml'

permissions:
  contents: write

jobs:
  rebrand-guide:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update AuditTicks guide branding
        shell: python
        run: |
          from pathlib import Path

          guide_path = Path('auditticks-pro/guide/index.md')
          js_path = Path('assets/js/auditticks-guide.js')

          guide = guide_path.read_text(encoding='utf-8')
          guide = guide.replace('AuditTicks Pro', 'AuditTicks')
          guide = guide.replace('Commercial v1.2.19', 'Commercial v1.2.21')
          guide = guide.replace('Work v1.2.20', 'Work v1.2.21')
          guide_path.write_text(guide, encoding='utf-8')

          js = js_path.read_text(encoding='utf-8')
          js = js.replace('AuditTicks Pro', 'AuditTicks')
          js_path.write_text(js, encoding='utf-8')

      - name: Validate branding
        shell: bash
        run: |
          if grep -Fq 'AuditTicks Pro' auditticks-pro/guide/index.md; then
            echo 'Old brand remains in guide.' >&2
            exit 1
          fi
          if grep -Fq 'AuditTicks Pro' assets/js/auditticks-guide.js; then
            echo 'Old brand remains in guide JavaScript.' >&2
            exit 1
          fi
          grep -Fq 'title: "AuditTicks User Guide"' auditticks-pro/guide/index.md
          grep -Fq 'Commercial v1.2.21' auditticks-pro/guide/index.md
          grep -Fq 'Work v1.2.21' auditticks-pro/guide/index.md
          grep -Fq '/auditticks-pro/guide/' auditticks-pro/guide/index.md
          grep -Fq 'AuditTicksPro_Icon.png' auditticks-pro/guide/index.md

      - name: Commit guide rebrand
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auditticks-pro/guide/index.md assets/js/auditticks-guide.js
          git commit -m 'Rebrand AuditTicks user guide'
          git push
