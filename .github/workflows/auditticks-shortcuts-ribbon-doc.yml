name: One-time AuditTicks shortcuts ribbon documentation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auditticks-shortcuts-ribbon-doc.yml'

permissions:
  contents: write

jobs:
  update-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update AuditTicks shortcut documentation
        shell: python
        run: |
          from pathlib import Path

          path = Path('auditticks-pro/guide/index.md')
          text = path.read_text(encoding='utf-8')

          text = text.replace('v1.2.27', 'v1.2.28')
          text = text.replace('<tr><td><strong>About</strong></td><td>User preferences and product information.</td><td>Settings, About AuditTicks</td></tr>',
                              '<tr><td><strong>About</strong></td><td>User preferences, shortcut reference, and product information.</td><td>Settings, Shortcuts, About AuditTicks</td></tr>')

          marker = '<h3>Keyboard Shortcuts guide</h3>\n        <p>Assign a shortcut to <strong>Tool - Toggle Keyboard Shortcuts</strong> to display a modeless quick-reference window containing the user\'s current mappings.'
          replacement = '<h3>Keyboard Shortcuts guide</h3>\n        <p>The guide can be opened directly from the <strong>Shortcuts</strong> button in the ribbon\'s <strong>About</strong> group. The same button closes the guide when it is already open.</p>\n        <p>Assign a shortcut to <strong>Tool - Toggle Keyboard Shortcuts</strong> to display a modeless quick-reference window containing the user\'s current mappings.'
          if marker in text and '<strong>Shortcuts</strong> button in the ribbon' not in text:
              text = text.replace(marker, replacement, 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit guide update
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auditticks-pro/guide/index.md
          git commit -m "Document AuditTicks Shortcuts ribbon button"
          git push
