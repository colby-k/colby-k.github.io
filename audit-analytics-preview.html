<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Audit Analytics case study preview</title>
  <base href="https://colby-k.github.io/">
  <link rel="stylesheet" href="https://colby-k.github.io/assets/css/style.css">
  <link rel="stylesheet" href="https://raw.githack.com/colby-k/colby-k.github.io/portfolio-v2-audit-analytics-case-study/assets/css/audit-analytics-case-study.css?v=1">
  <style>body{margin:0}.preview-banner{position:relative;z-index:3000;padding:.65rem 1rem;background:#fff3cd;color:#5c4700;text-align:center;font:700 14px/1.4 system-ui,sans-serif;border-bottom:1px solid #ead58b}.preview-shell{padding-top:1rem}.preview-error{padding:4rem;font:700 18px system-ui,sans-serif}</style>
</head>
<body>
  <div class="preview-banner">Branch preview · Vendor Payment Monitoring case study · live page unchanged</div>
  <main id="main_content" class="inner preview-shell"><p class="preview-error">Loading case study…</p></main>
  <script>
    fetch('https://raw.githubusercontent.com/colby-k/colby-k.github.io/portfolio-v2-audit-analytics-case-study/audit-analytics/index.md')
      .then(function(response){if(!response.ok)throw new Error('Preview source unavailable');return response.text();})
      .then(function(source){
        source=source.replace(/^---[\s\S]*?---\s*/, '').replace(/<link[^>]*audit-analytics-case-study\.css[^>]*>/, '');
        document.getElementById('main_content').innerHTML=source;
      })
      .catch(function(){document.getElementById('main_content').innerHTML='<p class="preview-error">The preview could not load. Refresh the page in a moment.</p>';});
  </script>
</body>
</html>
