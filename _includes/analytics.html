{% if jekyll.environment == "production" and site.google_analytics %}
<script>
  (function () {
    function loadAnalytics() {
      if (window.__portfolioAnalyticsLoaded) return;
      window.__portfolioAnalyticsLoaded = true;

      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag('js', new Date());
      window.gtag('config', '{{ site.google_analytics }}');

      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}';
      document.head.appendChild(script);
    }

    window.addEventListener('load', function () {
      if ('requestIdleCallback' in window) {
        window.requestIdleCallback(loadAnalytics, { timeout: 2500 });
      } else {
        window.setTimeout(loadAnalytics, 1000);
      }
    }, { once: true });
  }());
</script>
{% endif %}
