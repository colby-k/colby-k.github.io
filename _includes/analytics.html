{% if jekyll.environment == "production" and site.google_analytics %}
<script>
  (function () {
    var interactionEvents = ['pointerdown', 'keydown', 'touchstart', 'scroll'];

    function removeInteractionListeners() {
      interactionEvents.forEach(function (eventName) {
        window.removeEventListener(eventName, loadAnalytics);
      });
    }

    function loadAnalytics() {
      if (window.__portfolioAnalyticsLoaded) return;
      window.__portfolioAnalyticsLoaded = true;
      removeInteractionListeners();

      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag('js', new Date());
      window.gtag('config', '{{ site.google_analytics }}');

      var script = document.createElement('script');
      script.async = true;
      script.src = 'https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}';
      document.head.appendChild(script);
    }

    interactionEvents.forEach(function (eventName) {
      window.addEventListener(eventName, loadAnalytics, {
        once: true,
        passive: true
      });
    });

    window.addEventListener('load', function () {
      window.setTimeout(loadAnalytics, 8000);
    }, { once: true });
  }());
</script>
{% endif %}
