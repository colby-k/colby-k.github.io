<meta name="theme-color" content="#f5f5f7">

<link
  rel="stylesheet"
  href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}"
>

<link
  rel="stylesheet"
  href="{{ '/assets/css/navigation-v2.css?v=' | append: site.github.build_revision | relative_url }}"
>

{% if page.page_css %}
<link
  rel="stylesheet"
  href="{{ page.page_css | append: '?v=' | append: site.github.build_revision | relative_url }}"
>
{% endif %}

<link
  rel="stylesheet"
  href="{{ '/assets/css/contrast-fixes.css?v=' | append: site.github.build_revision | relative_url }}"
>

{% if page.preload_image %}
<link
  rel="preload"
  as="image"
  href="{{ page.preload_image | relative_url }}"
  fetchpriority="high"
>
{% endif %}

<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="48x48" href="{{ '/assets/img/favicon-48.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="192x192" href="{{ '/assets/img/icon-192.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">

{% include analytics.html %}
